<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paper Route</title>
<style>
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:#0d1016; color:#f4f1e4;
    font-family:"Courier New", ui-monospace, monospace; overflow:hidden; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 1.5625)); margin:0 auto;
    top:50%; transform:translateY(-50%); }
  canvas { display:block; width:100%; height:auto; background:#8ec3ef;
    border:3px solid #2a3242; border-radius:6px; box-shadow:0 0 40px rgba(0,0,0,.6); }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(8,10,16,.74); }
  #overlay.hidden { display:none; }
  #panel { width:min(80%, 660px); max-height:94%; overflow:auto; background:#141a26;
    border:3px solid #f2c14e; border-radius:10px; padding:20px 26px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.6); }
  #panel h1 { margin:0 0 4px; font-size:clamp(26px,5vw,46px); letter-spacing:5px; color:#f2c14e;
    text-shadow:3px 3px 0 #a4400f; }
  #panel h2 { margin:0 0 8px; font-size:clamp(16px,3vw,26px); color:#8fd67a; letter-spacing:2px; }
  #panel p { margin:6px 0; font-size:clamp(11px,1.7vw,15px); line-height:1.5; color:#d7d2c2; }
  #panel .rows { text-align:left; margin:12px auto; width:min(100%,430px); font-size:clamp(11px,1.7vw,15px); }
  #panel .rows div { display:flex; justify-content:space-between; padding:2px 0;
    border-bottom:1px dotted #33405a; }
  #panel .rows div b { color:#f2c14e; }
  #panel .keys { display:grid; grid-template-columns:auto 1fr; gap:5px 14px;
    margin:12px auto; width:min(100%,440px); text-align:left; font-size:clamp(11px,1.6vw,14px);
    color:#b9c2d6; }
  kbd { background:#26304a; border:1px solid #4a5a80; border-bottom-width:3px; border-radius:4px;
    padding:1px 6px; color:#fff; font-family:inherit; white-space:nowrap; }
  .blink { animation:bl 1.1s steps(2) infinite; color:#f2c14e; font-weight:bold; letter-spacing:2px; }
  @keyframes bl { 50% { opacity:.15; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1000" height="640"></canvas>
  <div id="overlay"><div id="panel"></div></div>
</div>
<script>
(function(){
'use strict';

// ---------------------------------------------------------------- setup
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var overlay = document.getElementById('overlay');
var panel = document.getElementById('panel');
var W = 1000, H = 640;

// axonometric projection: +y (up the street) goes up and to the right
var GROUND_Y = 558, VS = 0.60, SK = 0.40;
var FAR = 660, NEAR = -170;
var cam = 0;
function px(x, y) { return x + (y - cam) * SK; }
function py(y)    { return GROUND_Y - (y - cam) * VS; }
var HORIZON = GROUND_Y - FAR * VS;

// street layout (base x, measured at the camera plane)
var LX = {
  houseL0: 6,   houseL1: 150,
  lawnL0: 150,  lawnL1: 280,
  walkL0: 280,  walkL1: 300,
  road0: 300,   road1: 700,
  walkR0: 700,  walkR1: 720,
  lawnR0: 720,  lawnR1: 850,
  houseR0: 850, houseR1: 994,
  mailL: 268,   mailR: 732
};
var CLAMP_L = 176, CLAMP_R = 824;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
// a flat quad lying on the ground plane
function gquad(x0, x1, y0, y1, fill) {
  poly([[px(x0,y0),py(y0)], [px(x1,y0),py(y0)], [px(x1,y1),py(y1)], [px(x0,y1),py(y1)]], fill);
}
// an axis-aligned box on the ground: we see the near (-y) face, the right (+x) face and the top
function box3(x0, x1, y0, y1, h, front, side, top) {
  var ax = px(x0,y0), ay = py(y0), bx = px(x1,y0), by = py(y0);
  var cx = px(x1,y1), cy = py(y1), dx = px(x0,y1), dy = py(y1);
  poly([[bx,by],[cx,cy],[cx,cy-h],[bx,by-h]], side);
  poly([[ax,ay],[bx,by],[bx,by-h],[ax,ay-h]], front);
  poly([[ax,ay-h],[bx,by-h],[cx,cy-h],[dx,dy-h]], top);
}
function shadowAt(sx, sy, r) {
  ctx.fillStyle = 'rgba(0,0,0,.24)';
  ctx.beginPath(); ctx.ellipse(sx, sy, r, r * 0.42, 0, 0, 6.283); ctx.fill();
}
function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(((n >> 16) & 255) + amt, 0, 255) | 0;
  var g = clamp(((n >> 8) & 255) + amt, 0, 255) | 0;
  var b = clamp((n & 255) + amt, 0, 255) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ---------------------------------------------------------------- audio
var AC = null, muted = false;
function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  return AC;
}
function tone(f1, f2, dur, type, vol) {
  var a = actx(); if (!a || muted) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, a.currentTime);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(25, f2), a.currentTime + dur);
  g.gain.setValueAtTime(vol == null ? 0.1 : vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noise(dur, vol, f0, f1) {
  var a = actx(); if (!a || muted) return;
  var n = Math.max(1, Math.floor(a.sampleRate * dur));
  var buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = a.createBufferSource(); s.buffer = buf;
  var bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(f0, a.currentTime);
  if (f1) bp.frequency.exponentialRampToValueAtTime(Math.max(30, f1), a.currentTime + dur);
  var g = a.createGain(); g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime + dur);
  s.connect(bp); bp.connect(g); g.connect(a.destination); s.start();
}
function sfx(name) {
  switch (name) {
    case 'throw':   noise(0.16, 0.16, 900, 2600); break;
    case 'mailbox': tone(760, 1300, 0.13, 'square', 0.11);
                    setTimeout(function(){ tone(1180, 1650, 0.12, 'square', 0.09); }, 70); break;
    case 'porch':   tone(560, 780, 0.13, 'triangle', 0.11); break;
    case 'smash':   noise(0.45, 0.3, 4200, 700); tone(1500, 300, 0.2, 'sawtooth', 0.06); break;
    case 'thud':    noise(0.12, 0.16, 220, 90); break;
    case 'crash':   noise(0.55, 0.34, 1400, 90); tone(300, 60, 0.5, 'sawtooth', 0.12); break;
    case 'pickup':  tone(620, 980, 0.12, 'square', 0.1); break;
    case 'cancel':  tone(340, 120, 0.42, 'sawtooth', 0.11); break;
    case 'knock':   noise(0.2, 0.2, 700, 180); break;
    case 'horn':    tone(330, 300, 0.26, 'square', 0.06); break;
    case 'bark':    tone(420, 180, 0.1, 'sawtooth', 0.08); break;
    case 'bell':    tone(1400, 1400, 0.07, 'square', 0.09);
                    setTimeout(function(){ tone(1900, 1900, 0.1, 'square', 0.08); }, 80); break;
    case 'day':     [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f, f, 0.14, 'square', 0.09); }, i * 110); }); break;
    case 'over':    [523,392,311,196].forEach(function(f,i){ setTimeout(function(){ tone(f, f * 0.94, 0.3, 'sawtooth', 0.1); }, i * 190); }); break;
  }
}

// ---------------------------------------------------------------- input
var keys = {};
var THROW_L = { KeyZ:1, KeyQ:1, Comma:1, Digit1:1, Numpad1:1 };
var THROW_R = { KeyX:1, KeyE:1, Period:1, Digit3:1, Numpad3:1 };
window.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  actx();
  onKey(e.code);
});
window.addEventListener('keyup', function(e) { keys[e.code] = false; });
window.addEventListener('blur', function() { keys = {}; });
function down(list) { for (var i = 0; i < list.length; i++) if (keys[list[i]]) return true; return false; }

// ---------------------------------------------------------------- state
var DAY_NAMES = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
var state = 'title';
var game = null;
var P = null;
var houses = [], obs = [], pickups = [], papers = [], litter = [], parts = [], texts = [];
var shakeT = 0, shakeAmp = 0, flashT = 0;

var HOUSE_COLS = ['#e0d3a8','#d9a7a2','#a8c7d6','#cfd8a5','#e3c091','#c3b2d6','#a9d4bb','#e6b7c8'];
var CAR_COLS = ['#d84b3f','#3f7cd8','#e0b13a','#5fbf72','#c0c6cf','#9a52c9','#e07a2f'];

function dayCfg(d) {
  return {
    length: 6200 + (d - 1) * 850,
    density: Math.min(1.9, 0.75 + (d - 1) * 0.16),
    carSpeed: 250 + (d - 1) * 26,
    subChance: Math.max(0.42, 0.62 - (d - 1) * 0.03)
  };
}

function newGame() {
  game = {
    day: 1, score: 0, lives: 3, papers: 10, maxPapers: 15,
    len: 0, cfg: null, streak: 0, best: 0,
    delivered: 0, perfect: 0, smashed: 0, missed: 0, knocked: 0,
    subsTotal: 0, subsLeft: 0, time: 0, finishT: 0
  };
  startDay();
}

function startDay() {
  var cfg = dayCfg(game.day);
  game.cfg = cfg;
  game.len = cfg.length;
  game.papers = 10;
  game.delivered = 0; game.perfect = 0; game.smashed = 0;
  game.missed = 0; game.knocked = 0; game.streak = 0; game.best = 0;
  game.finishT = 0;
  buildStreet(cfg);
  P = { x: 500, y: 0, speed: 250, lean: 0, cool: 0, crash: 0, invul: 1.2, bob: 0, wobble: 0 };
  cam = 0;
  papers = []; litter = []; parts = []; texts = [];
  shakeT = 0; flashT = 0;
}

// ---------------------------------------------------------------- world build
function buildStreet(cfg) {
  houses = []; obs = []; pickups = [];
  var y, i, subs = 0;

  // houses: alternating rows down both sides of the street
  for (y = 620; y < cfg.length - 380; y += 300) {
    ['L','R'].forEach(function(side) {
      if (Math.random() < 0.1) return;                 // vacant lot
      var hy = y + (side === 'R' ? 150 : 0);
      var sub = Math.random() < cfg.subChance;
      if (sub) subs++;
      houses.push({
        side: side, y: hy, sub: sub, delivered: false, missed: false,
        col: sub ? pick(HOUSE_COLS) : '#8d8479',
        roof: sub ? pick(['#8a4a3c','#4a5a7a','#5d7048','#7a5a3a']) : '#5c574f',
        h: ri(96, 128), broken: [false, false, false], flag: sub, bounce: Math.random() * 6.283,
        tree: Math.random() < 0.35, hedge: Math.random() < 0.4
      });
    });
  }
  if (subs === 0 && houses.length) { houses[0].sub = true; houses[0].col = pick(HOUSE_COLS); subs = 1; }
  game.subsTotal = subs; game.subsLeft = subs;

  // obstacles
  var types = [
    ['can', 16], ['hydrant', 7], ['gnome', 6], ['tree', 7], ['barrier', 8],
    ['tire', 6], ['dog', 9], ['skater', 8], ['car', 11], ['truck', 6], ['breaker', 6]
  ];
  var total = 0; types.forEach(function(t) { total += t[1]; });
  y = 780;
  while (y < cfg.length - 240) {
    var n = Math.random() < cfg.density - 1 ? 2 : 1;
    for (i = 0; i < n; i++) {
      var r = Math.random() * total, t = types[0][0];
      for (var k = 0; k < types.length; k++) { r -= types[k][1]; if (r <= 0) { t = types[k][0]; break; } }
      obs.push(makeObs(t, y + rnd(-40, 40), cfg));
    }
    y += rnd(210, 340) / Math.max(0.8, cfg.density);
  }

  // spare paper bundles on the road
  for (y = 900; y < cfg.length - 200; y += rnd(750, 1050)) {
    pickups.push({ x: rnd(340, 660), y: y, t: Math.random() * 6.283, got: false });
  }
}

function makeObs(t, y, cfg) {
  var side = Math.random() < 0.5 ? -1 : 1;
  var o = { t: t, y: y, x: 500, rx: 15, ry: 15, vx: 0, vy: 0, dead: false, t0: Math.random() * 6.283,
            col: pick(CAR_COLS), spin: 0, honked: false };
  switch (t) {
    case 'can':     o.x = rnd(320, 680); o.rx = 15; o.ry = 15; o.knock = true; break;
    case 'hydrant': o.x = side < 0 ? rnd(186, 262) : rnd(738, 814); o.rx = 12; o.ry = 12; break;
    case 'gnome':   o.x = side < 0 ? rnd(180, 258) : rnd(742, 820); o.rx = 11; o.ry = 11; o.knock = true; break;
    case 'tree':    o.x = side < 0 ? rnd(178, 200) : rnd(800, 822); o.rx = 16; o.ry = 16; break;
    case 'barrier': o.x = rnd(340, 660); o.rx = 30; o.ry = 12; break;
    case 'tire':    o.x = rnd(330, 670); o.rx = 13; o.ry = 13; o.vy = -70; break;
    case 'dog':     o.x = side < 0 ? 288 : 712; o.rx = 13; o.ry = 13; o.home = o.x; break;
    case 'skater':  o.x = rnd(340, 660); o.rx = 13; o.ry = 14; o.amp = rnd(90, 170); o.base = o.x; break;
    case 'breaker': o.x = side < 0 ? 290 : 710; o.rx = 16; o.ry = 16; break;
    case 'car':     o.x = rnd(330, 410); o.rx = 26; o.ry = 52; o.vy = -cfg.carSpeed; break;
    case 'truck':   o.x = rnd(570, 655); o.rx = 30; o.ry = 66; o.vy = 120; break;
  }
  return o;
}

// ---------------------------------------------------------------- effects
function burst(x, y, z, n, col, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * 6.283, s = rnd(0.3, 1) * (spd || 160);
    parts.push({ x: x, y: y, z: z, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.5,
                 vz: rnd(40, 220), life: rnd(0.4, 0.95), max: 1, col: col, sz: rnd(2, 4.5) });
  }
}
function floatText(x, y, txt, col) {
  texts.push({ x: x, y: y, txt: txt, col: col || '#fff', life: 1.1, z: 60 });
}
function shakeIt(amp, t) { shakeAmp = Math.max(shakeAmp, amp); shakeT = Math.max(shakeT, t); }
function addScore(n) { game.score += n; }

// ---------------------------------------------------------------- gameplay
function houseAt(y, side) {
  for (var i = 0; i < houses.length; i++) {
    var h = houses[i];
    if (h.side === side && y > h.y - 72 && y < h.y + 72) return h;
  }
  return null;
}

function throwPaper(dir) {
  if (state !== 'play' || P.crash > 0 || P.cool > 0) return;
  if (game.papers <= 0) { sfx('thud'); floatText(P.x, P.y + 20, 'OUT OF PAPERS', '#ff8a6a'); return; }
  game.papers--;
  P.cool = 0.16;
  papers.push({ x: P.x, y: P.y + 8, z: 30,
                vx: dir * 520, vy: P.speed * 0.34, vz: 210,
                rot: 0, rotv: dir * 17, dir: dir, dead: false });
  sfx('throw');
}

function deliver(h, kind) {
  h.delivered = true; h.flag = false;
  game.delivered++;
  if (kind === 'mail') {
    game.perfect++; game.streak++;
    if (game.streak > game.best) game.best = game.streak;
    var bonus = Math.min(250, (game.streak - 1) * 50);
    addScore(250 + bonus);
    floatText(h.side === 'L' ? LX.mailL : LX.mailR, h.y, bonus ? '250 +' + bonus : '250', '#ffe27a');
    if (game.streak > 1) floatText(h.side === 'L' ? LX.mailL : LX.mailR, h.y - 34, 'STREAK x' + game.streak, '#8fd67a');
    sfx('mailbox');
    burst(h.side === 'L' ? LX.mailL : LX.mailR, h.y, 40, 10, '#ffe27a', 90);
  } else {
    game.streak = 0;
    addScore(100);
    floatText(h.side === 'L' ? 200 : 800, h.y, '100', '#cfe8ff');
    sfx('porch');
  }
}

function cancelSub(h, reason) {
  if (!h.sub || h.missed) return;
  h.missed = true; h.sub = false; h.flag = false;
  h.col = '#8d8479'; h.roof = '#5c574f';
  game.missed++; game.subsLeft--; game.streak = 0;
  floatText(h.side === 'L' ? 210 : 790, h.y, reason, '#ff6b5e');
  sfx('cancel');
  if (game.subsLeft <= 0) endGame(true);
}

function paperLands(p) {
  p.dead = true;
  litter.push({ x: p.x, y: p.y, rot: p.rot });
  if (litter.length > 70) litter.shift();
  // porch strip beside a house
  var side = p.x < 500 ? 'L' : 'R';
  var onPorch = (side === 'L' && p.x < 205) || (side === 'R' && p.x > 795);
  if (onPorch) {
    var h = houseAt(p.y, side);
    if (h && h.sub && !h.delivered) { deliver(h, 'porch'); return; }
  }
  burst(p.x, p.y, 4, 4, '#e8e4d4', 60);
  sfx('thud');
}

function hitWall(p, side) {
  var h = houseAt(p.y, side);
  p.dead = true;
  if (!h) { sfx('thud'); burst(p.x, p.y, p.z, 4, '#9aa08e', 60); return; }
  if (p.z > 26) {
    // window height: a smash
    var wi = p.y < h.y ? 0 : (p.y > h.y + 20 ? 2 : 1);
    if (!h.broken[wi]) { h.broken[wi] = true; game.smashed++; }
    burst(p.x, p.y, p.z, 16, '#dff2ff', 200);
    shakeIt(5, 0.22);
    sfx('smash');
    if (h.sub && !h.delivered) {
      cancelSub(h, 'BROKEN WINDOW!');
    } else if (h.sub) {
      floatText(side === 'L' ? 190 : 810, h.y, 'OOPS...', '#ffb56a');
    } else {
      addScore(150);
      floatText(side === 'L' ? 190 : 810, h.y, 'SMASH! 150', '#8fd6ff');
    }
  } else {
    if (h.sub && !h.delivered) { deliver(h, 'porch'); }
    else { sfx('thud'); burst(p.x, p.y, p.z, 4, '#9aa08e', 60); }
  }
}

function crash(what) {
  if (P.crash > 0 || P.invul > 0) return;
  P.crash = 1.25;
  P.invul = 2.4;
  game.streak = 0;
  game.lives--;
  sfx('crash');
  shakeIt(14, 0.5);
  flashT = 0.18;
  burst(P.x, P.y, 20, 22, '#ffd27a', 220);
  floatText(P.x, P.y + 20, what, '#ff6b5e');
}

function endGame(fired) {
  state = 'over';
  sfx('over');
  try { parent.postMessage({ type:'arcade:gameover', game:'paper-route', score:game.score }, '*'); } catch(e){}
  showGameOver(fired);
}

// ---------------------------------------------------------------- update
function update(dt) {
  game.time += dt;
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeAmp = 0; }
  if (flashT > 0) flashT -= dt;

  updatePlayer(dt);
  updatePapers(dt);
  updateObs(dt);
  updatePickups(dt);
  updateHouses(dt);
  updateFx(dt);

  cam = P.y;

  if (P.y >= game.len && state === 'play') {
    state = 'finish';
    game.finishT = 0;
    sfx('day');
  }
}

function updatePlayer(dt) {
  if (P.cool > 0) P.cool -= dt;
  if (P.invul > 0) P.invul -= dt;

  if (P.crash > 0) {
    P.crash -= dt;
    P.speed = Math.max(0, P.speed - 620 * dt);
    P.y += P.speed * dt;
    if (P.crash <= 0) {
      if (game.lives <= 0) { endGame(false); return; }
      P.speed = 190; P.x = clamp(P.x, 340, 660); P.wobble = 0;
    }
    return;
  }

  var fast = down(['ArrowUp','KeyW']);
  var slow = down(['ArrowDown','KeyS']);
  var target = fast ? 400 : (slow ? 130 : 260);
  P.speed += (target - P.speed) * Math.min(1, dt * 2.6);

  var steer = 0;
  if (down(['ArrowLeft','KeyA'])) steer -= 1;
  if (down(['ArrowRight','KeyD'])) steer += 1;
  P.x = clamp(P.x + steer * 330 * dt, CLAMP_L, CLAMP_R);
  P.lean += (steer - P.lean) * Math.min(1, dt * 9);
  P.y += P.speed * dt;
  P.bob += dt * (6 + P.speed * 0.03);

  // riding on grass costs speed
  if (P.x < LX.walkL0 || P.x > LX.walkR1) P.speed *= (1 - 0.5 * dt);
}

function updatePapers(dt) {
  for (var i = papers.length - 1; i >= 0; i--) {
    var p = papers[i];
    var prevx = p.x;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vz -= 900 * dt;
    p.rot += p.rotv * dt;

    // mailbox catch
    if (!p.dead && p.vz < 0 && p.z > 4 && p.z < 58) {
      for (var j = 0; j < houses.length; j++) {
        var h = houses[j];
        if (!h.sub || h.delivered) continue;
        var mx = h.side === 'L' ? LX.mailL : LX.mailR;
        if (Math.abs(p.x - mx) < 24 && Math.abs(p.y - h.y) < 26) {
          p.dead = true; deliver(h, 'mail'); break;
        }
      }
    }
    // knock things over
    if (!p.dead && p.z < 34) {
      for (var k = 0; k < obs.length; k++) {
        var o = obs[k];
        if (o.dead || !o.knock) continue;
        if (Math.abs(p.x - o.x) < o.rx + 8 && Math.abs(p.y - o.y) < o.ry + 8) {
          o.dead = true; p.dead = true;
          game.knocked++; addScore(50);
          floatText(o.x, o.y, '50', '#ffd27a');
          burst(o.x, o.y, 14, 8, o.t === 'can' ? '#b9bec7' : '#e3b7a0', 150);
          sfx('knock');
          break;
        }
      }
    }
    if (!p.dead && prevx > LX.houseL1 && p.x <= LX.houseL1) hitWall(p, 'L');
    if (!p.dead && prevx < LX.houseR0 && p.x >= LX.houseR0) hitWall(p, 'R');
    if (!p.dead && p.z <= 0) paperLands(p);
    if (p.dead || p.y < cam - 250 || p.y > cam + FAR + 150) papers.splice(i, 1);
  }
}

function updateObs(dt) {
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    var d = o.y - P.y;
    if (o.dead || d < NEAR - 220 || d > FAR + 260) continue;
    o.t0 += dt;
    switch (o.t) {
      case 'car':
      case 'truck':
        o.y += o.vy * dt;
        if (o.t === 'car' && !o.honked && d < 300 && d > 0 && Math.abs(o.x - P.x) < 90) {
          o.honked = true; sfx('horn');
        }
        break;
      case 'tire':
        o.y += o.vy * dt; o.spin += dt * 7; break;
      case 'skater':
        o.x = o.base + Math.sin(o.t0 * 1.7) * o.amp;
        o.y += 50 * dt; break;
      case 'dog':
        if (d < 300 && d > -60) {
          var dir = P.x > o.x ? 1 : -1;
          o.x += dir * 130 * dt;
          o.y += P.speed * 0.55 * dt;
          if (!o.barked) { o.barked = true; sfx('bark'); }
        } else { o.x += (o.home - o.x) * dt; }
        break;
      case 'breaker':
        o.spin += dt * 6;
        o.x += Math.sin(o.t0 * 2.2) * 26 * dt;
        break;
    }
    // collision with the bike
    if (P.crash <= 0 && P.invul <= 0) {
      var dx = (P.x - o.x) / (o.rx + 9), dy = (P.y - o.y) / (o.ry + 9);
      if (dx * dx + dy * dy < 1) {
        o.hitFlash = 0.3;
        crash(o.t === 'car' || o.t === 'truck' ? 'SMACK!' : 'WIPEOUT!');
        if (o.knock) o.dead = true;
      }
    }
  }
}

function updatePickups(dt) {
  for (var i = 0; i < pickups.length; i++) {
    var b = pickups[i];
    if (b.got) continue;
    b.t += dt * 3;
    if (Math.abs(b.x - P.x) < 26 && Math.abs(b.y - P.y) < 26 && P.crash <= 0) {
      b.got = true;
      var add = Math.min(10, game.maxPapers - game.papers);
      game.papers += add;
      addScore(25);
      floatText(b.x, b.y, '+' + add + ' PAPERS', '#8fd67a');
      burst(b.x, b.y, 16, 10, '#fdfbf0', 130);
      sfx('pickup');
    }
  }
}

function updateHouses(dt) {
  for (var i = 0; i < houses.length; i++) {
    var h = houses[i];
    h.bounce += dt * 4;
    if (h.sub && !h.delivered && !h.missed && P.y > h.y + 110) cancelSub(h, 'CANCELLED!');
  }
}

function updateFx(dt) {
  var i;
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vz -= 620 * dt;
    if (p.z < 0) { p.z = 0; p.vz *= -0.35; p.vx *= 0.6; p.vy *= 0.6; }
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (i = texts.length - 1; i >= 0; i--) {
    var t = texts[i];
    t.life -= dt; t.z += 34 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
}

// ---------------------------------------------------------------- drawing: scenery
function drawSky() {
  var g = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  g.addColorStop(0, '#4a86c8');
  g.addColorStop(0.55, '#8ec3ef');
  g.addColorStop(1, '#d8e8f2');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HORIZON + 2);

  // sun
  ctx.fillStyle = 'rgba(255,240,190,.85)';
  ctx.beginPath(); ctx.arc(150, 90, 34, 0, 6.283); ctx.fill();

  // parallax skyline
  var off = -(cam * 0.035) % 220;
  ctx.fillStyle = '#7d94ad';
  for (var i = -1; i < 7; i++) {
    var bx = off + i * 220;
    ctx.fillRect(bx + 20, HORIZON - 74, 52, 74);
    ctx.fillRect(bx + 82, HORIZON - 48, 40, 48);
    ctx.fillRect(bx + 130, HORIZON - 92, 34, 92);
    ctx.fillRect(bx + 172, HORIZON - 40, 36, 40);
  }
  // distant treeline
  ctx.fillStyle = '#4f7a52';
  ctx.beginPath();
  ctx.moveTo(0, HORIZON + 1);
  for (var x = 0; x <= W; x += 26) {
    var hh = 16 + Math.sin((x + cam * 0.08) * 0.07) * 8 + Math.sin(x * 0.31) * 5;
    ctx.lineTo(x, HORIZON - hh);
  }
  ctx.lineTo(W, HORIZON + 1);
  ctx.closePath(); ctx.fill();
}

function drawGround() {
  var y0 = cam + NEAR - 200, y1 = cam + FAR;
  gquad(-600, 1600, y0, y1, '#6ba354');                       // grass
  // lawn stripes for texture
  ctx.globalAlpha = 0.16;
  for (var y = Math.floor(y0 / 160) * 160; y < y1; y += 160) {
    gquad(-600, 1600, y, y + 80, '#8dbf6b');
  }
  ctx.globalAlpha = 1;

  gquad(LX.lawnL1, LX.walkL1, y0, y1, '#c9c6ba');             // sidewalks
  gquad(LX.walkR0, LX.lawnR0, y0, y1, '#c9c6ba');
  gquad(LX.road0 - 6, LX.road0, y0, y1, '#e6e3d8');           // curbs
  gquad(LX.road1, LX.road1 + 6, y0, y1, '#e6e3d8');
  gquad(LX.road0, LX.road1, y0, y1, '#4b4d52');               // asphalt
  gquad(LX.road0 + 4, LX.road0 + 10, y0, y1, '#d9d5c2');      // edge lines
  gquad(LX.road1 - 10, LX.road1 - 4, y0, y1, '#d9d5c2');

  // centre dashes
  var s = Math.floor(y0 / 110) * 110;
  for (var d = s; d < y1; d += 110) gquad(494, 506, d, d + 52, '#e8e2c8');

  // asphalt speckle
  ctx.globalAlpha = 0.1;
  for (var i = 0; i < 26; i++) {
    var sy = ((i * 271 + Math.floor(cam * 0.4)) % 900) - 200 + cam;
    gquad(320 + (i * 53) % 340, 330 + (i * 53) % 340, sy, sy + 14, '#000');
  }
  ctx.globalAlpha = 1;

  // finish line
  if (game.len < cam + FAR) {
    for (var c = 0; c < 10; c++) {
      gquad(LX.road0 + c * 40, LX.road0 + c * 40 + 40, game.len, game.len + 22,
            c % 2 ? '#f4f1e4' : '#22242a');
    }
    var fp = px(500, game.len), fy = py(game.len);
    ctx.fillStyle = '#2a3242';
    ctx.fillRect(fp - 150, fy - 128, 300, 26);
    ctx.fillStyle = '#f2c14e';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('END OF STREET', fp, fy - 109);
    ctx.fillStyle = '#8b6f3a';
    ctx.fillRect(fp - 150, fy - 128, 8, 128);
    ctx.fillRect(fp + 142, fy - 128, 8, 128);
  }
}

function drawLitter() {
  for (var i = 0; i < litter.length; i++) {
    var l = litter[i];
    if (l.y < cam + NEAR || l.y > cam + FAR) continue;
    var sx = px(l.x, l.y), sy = py(l.y);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(l.rot);
    ctx.fillStyle = '#efeade'; ctx.fillRect(-7, -3, 14, 6);
    ctx.fillStyle = '#c9c3b2'; ctx.fillRect(-7, -3, 14, 2);
    ctx.restore();
  }
}

function drawHouse(h) {
  var L = h.side === 'L';
  var x0 = L ? LX.houseL0 + 14 : LX.houseR0 + 4;
  var x1 = L ? LX.houseL1 : LX.houseR1 - 10;
  var y0 = h.y - 62, y1 = h.y + 62;
  var hh = h.h;
  var body = h.col, side = shade(h.col, -34), top = shade(h.col, 18);

  // lawn patch + path to the street
  gquad(L ? LX.lawnL0 : LX.lawnR0, L ? LX.lawnL1 : LX.lawnR1, y0 - 26, y1 + 26,
        h.sub ? '#7cb35e' : '#6f9a5a');
  gquad(L ? LX.lawnL0 : LX.lawnR0, L ? LX.lawnL1 : LX.lawnR1, h.y - 15, h.y + 15, '#cfc9b6');

  // porch slab
  if (L) gquad(x1, x1 + 44, h.y - 40, h.y + 40, '#b7b0a0');
  else   gquad(x0 - 44, x0, h.y - 40, h.y + 40, '#b7b0a0');

  box3(x0, x1, y0, y1, hh, body, side, top);

  // roof: gable running front-to-back with the ridge in the middle
  var mid = (x0 + x1) / 2, rh = 44;
  var ax = px(x0, y0), ay = py(y0) - hh, bx = px(x1, y0), by = py(y0) - hh;
  var cx = px(x1, y1), cy = py(y1) - hh;
  var r0x = px(mid, y0), r0y = py(y0) - hh - rh;
  var r1x = px(mid, y1), r1y = py(y1) - hh - rh;
  poly([[bx,by],[cx,cy],[r1x,r1y],[r0x,r0y]], shade(h.roof, -26));
  poly([[ax,ay],[bx,by],[r0x,r0y]], h.roof);
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(r0x, r0y); ctx.lineTo(r1x, r1y); ctx.stroke();

  // detail face: the street-facing (+x) side for left houses, the near face for right houses
  var i, wy, wx, ww = 22, whh = 26;
  ctx.save();
  if (L) {
    for (i = 0; i < 3; i++) {
      var yy = h.y - 38 + i * 38;
      wx = px(x1, yy); wy = py(yy) - hh * 0.62;
      drawWindow(wx, wy, ww * 0.8, whh, h.broken[i], h.sub);
    }
    // door on the porch side
    var dyy = h.y + 4;
    ctx.fillStyle = '#5d4433';
    var dx = px(x1, dyy), dyv = py(dyy);
    ctx.beginPath();
    ctx.moveTo(dx, dyv); ctx.lineTo(dx + SK * 30, dyv - VS * 30);
    ctx.lineTo(dx + SK * 30, dyv - VS * 30 - 46); ctx.lineTo(dx, dyv - 46);
    ctx.closePath(); ctx.fill();
  } else {
    for (i = 0; i < 3; i++) {
      wx = px(x0 + 26 + i * 40, y0); wy = py(y0) - hh * 0.62;
      drawWindow(wx, wy, ww, whh, h.broken[i], h.sub);
    }
    ctx.fillStyle = '#5d4433';
    ctx.fillRect(px(x0 + 6, y0), py(y0) - 48, 22, 48);
  }
  ctx.restore();

  // number plate / boarded sign
  if (!h.sub) {
    ctx.fillStyle = 'rgba(60,52,44,.6)';
    var sx = px(L ? x1 - 4 : x0 + 20, h.y - 58), sy = py(h.y - 58) - hh - 6;
    ctx.fillRect(sx - 14, sy, 28, 10);
  }

  drawMailbox(h);

  if (h.hedge) {
    var hx0 = L ? LX.lawnL0 : LX.lawnR0, hx1 = L ? LX.lawnL0 + 16 : LX.lawnR1 - 16;
    box3(hx0, hx1, y0 - 20, h.y - 26, 20, '#3f7a44', '#356a3a', '#4f9455');
  }
  if (h.tree) {
    var tx = L ? LX.lawnL0 + 46 : LX.lawnR1 - 46;
    drawTreeAt(tx, y0 - 16, 54);
  }
}

function drawWindow(wx, wy, w, h, broken, lit) {
  ctx.fillStyle = broken ? '#171a20' : (lit ? '#ffe9a8' : '#93a6b5');
  ctx.fillRect(wx - w / 2, wy - h, w, h);
  ctx.strokeStyle = '#f4f1e4'; ctx.lineWidth = 2;
  ctx.strokeRect(wx - w / 2, wy - h, w, h);
  if (broken) {
    ctx.strokeStyle = '#cfe6f5'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wx - w / 2, wy - h); ctx.lineTo(wx + w / 4, wy - h / 2);
    ctx.lineTo(wx - w / 3, wy); ctx.moveTo(wx + w / 2, wy - h * 0.8);
    ctx.lineTo(wx - w / 6, wy - h * 0.35);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(wx, wy - h); ctx.lineTo(wx, wy);
    ctx.moveTo(wx - w / 2, wy - h / 2); ctx.lineTo(wx + w / 2, wy - h / 2);
    ctx.stroke();
  }
}

function drawMailbox(h) {
  var mx = h.side === 'L' ? LX.mailL : LX.mailR;
  var sx = px(mx, h.y), sy = py(h.y);
  shadowAt(sx, sy, 12);
  ctx.fillStyle = '#6b5238';
  ctx.fillRect(sx - 3, sy - 34, 6, 34);
  var body = h.sub ? (h.delivered ? '#5f9e5c' : '#c9c4b4') : '#7a746a';
  ctx.fillStyle = body;
  ctx.fillRect(sx - 13, sy - 52, 26, 18);
  ctx.fillStyle = shade(h.sub ? (h.delivered ? '#5f9e5c' : '#c9c4b4') : '#7a746a', 26);
  ctx.beginPath();
  ctx.moveTo(sx - 13, sy - 52); ctx.lineTo(sx, sy - 60); ctx.lineTo(sx + 13, sy - 52);
  ctx.closePath(); ctx.fill();
  if (h.flag) {
    ctx.fillStyle = '#e04b3a';
    ctx.fillRect(sx + 12, sy - 62, 3, 16);
    ctx.fillRect(sx + 15, sy - 62, 9, 8);
    // marker arrow so you can spot a waiting customer
    var b = Math.sin(h.bounce) * 4;
    ctx.fillStyle = 'rgba(242,193,78,.95)';
    ctx.beginPath();
    ctx.moveTo(sx, sy - 82 + b); ctx.lineTo(sx - 9, sy - 96 + b); ctx.lineTo(sx + 9, sy - 96 + b);
    ctx.closePath(); ctx.fill();
  } else if (h.delivered) {
    ctx.strokeStyle = '#8fd67a'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx - 7, sy - 68); ctx.lineTo(sx - 2, sy - 62); ctx.lineTo(sx + 8, sy - 76);
    ctx.stroke();
  }
}

function drawTreeAt(x, y, size) {
  var sx = px(x, y), sy = py(y);
  shadowAt(sx, sy, size * 0.34);
  ctx.fillStyle = '#6b4b2f';
  ctx.fillRect(sx - 5, sy - size * 0.7, 10, size * 0.7);
  ctx.fillStyle = '#3f7a44';
  ctx.beginPath(); ctx.ellipse(sx, sy - size, size * 0.62, size * 0.55, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#549450';
  ctx.beginPath(); ctx.ellipse(sx - size * 0.16, sy - size * 1.12, size * 0.4, size * 0.34, 0, 0, 6.283); ctx.fill();
}

// ---------------------------------------------------------------- drawing: entities
function drawObs(o) {
  var sx = px(o.x, o.y), sy = py(o.y);
  switch (o.t) {
    case 'can':
      shadowAt(sx, sy, 15);
      box3(o.x - 14, o.x + 14, o.y - 14, o.y + 14, 30, '#8f959e', '#767c85', '#b9bec7');
      ctx.fillStyle = '#6d737b';
      ctx.fillRect(sx - 12, sy - 20, 24, 3);
      break;
    case 'hydrant':
      shadowAt(sx, sy, 11);
      ctx.fillStyle = '#d1483a'; ctx.fillRect(sx - 7, sy - 26, 14, 26);
      ctx.fillRect(sx - 12, sy - 18, 24, 6);
      ctx.beginPath(); ctx.arc(sx, sy - 27, 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#a33628'; ctx.fillRect(sx - 7, sy - 4, 14, 4);
      break;
    case 'gnome':
      shadowAt(sx, sy, 10);
      ctx.fillStyle = '#3f6fbf'; ctx.fillRect(sx - 7, sy - 16, 14, 16);
      ctx.fillStyle = '#f0d0b0'; ctx.beginPath(); ctx.arc(sx, sy - 20, 6, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#d1483a';
      ctx.beginPath(); ctx.moveTo(sx - 7, sy - 22); ctx.lineTo(sx, sy - 36); ctx.lineTo(sx + 7, sy - 22);
      ctx.closePath(); ctx.fill();
      break;
    case 'tree':
      drawTreeAt(o.x, o.y, 58);
      break;
    case 'barrier':
      shadowAt(sx, sy, 26);
      box3(o.x - 30, o.x + 30, o.y - 8, o.y + 8, 26, '#e0862c', '#b96c22', '#f0a04a');
      ctx.fillStyle = '#f4f1e4';
      for (var s = -2; s <= 2; s++) ctx.fillRect(sx + s * 12 - 3, sy - 24, 6, 20);
      break;
    case 'tire':
      shadowAt(sx, sy, 13);
      ctx.save(); ctx.translate(sx, sy - 12); ctx.rotate(o.spin);
      ctx.fillStyle = '#23262b';
      ctx.beginPath(); ctx.ellipse(0, 0, 14, 13, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#4a4f57';
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 5.5, 0, 0, 6.283); ctx.fill();
      ctx.restore();
      break;
    case 'dog':
      shadowAt(sx, sy, 13);
      ctx.fillStyle = '#8a5a34';
      ctx.fillRect(sx - 13, sy - 18, 26, 12);
      ctx.fillRect(sx - 11, sy - 8, 4, 8); ctx.fillRect(sx + 7, sy - 8, 4, 8);
      ctx.beginPath(); ctx.arc(sx + 14, sy - 22, 8, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#6b432a';
      ctx.fillRect(sx + 9, sy - 32, 5, 8);
      ctx.fillRect(sx - 18, sy - 22, 7, 4);
      ctx.fillStyle = '#111'; ctx.fillRect(sx + 17, sy - 24, 3, 3);
      break;
    case 'skater':
      shadowAt(sx, sy, 14);
      ctx.fillStyle = '#3a3f48'; ctx.fillRect(sx - 15, sy - 5, 30, 5);
      ctx.fillStyle = '#2b6fbf'; ctx.fillRect(sx - 6, sy - 30, 12, 25);
      ctx.fillStyle = '#e8c9a0'; ctx.beginPath(); ctx.arc(sx, sy - 37, 8, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#d1483a'; ctx.fillRect(sx - 8, sy - 44, 16, 6);
      break;
    case 'breaker':
      shadowAt(sx, sy, 16);
      ctx.save(); ctx.translate(sx, sy - 16); ctx.rotate(o.spin);
      ctx.fillStyle = '#c94f9e'; ctx.fillRect(-8, -14, 16, 28);
      ctx.fillStyle = '#e8c9a0';
      ctx.fillRect(-22, -4, 14, 7); ctx.fillRect(8, -4, 14, 7);
      ctx.restore();
      ctx.fillStyle = '#e8c9a0';
      ctx.beginPath(); ctx.arc(sx, sy - 36, 8, 0, 6.283); ctx.fill();
      break;
    case 'car':
    case 'truck':
      drawCar(o);
      break;
  }
}

function drawCar(o) {
  var long = o.ry, wide = o.rx;
  var sx = px(o.x, o.y), sy = py(o.y);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath();
  ctx.moveTo(px(o.x - wide, o.y - long), py(o.y - long));
  ctx.lineTo(px(o.x + wide, o.y - long), py(o.y - long));
  ctx.lineTo(px(o.x + wide, o.y + long), py(o.y + long));
  ctx.lineTo(px(o.x - wide, o.y + long), py(o.y + long));
  ctx.closePath(); ctx.fill();

  var bodyH = o.t === 'truck' ? 38 : 26;
  box3(o.x - wide, o.x + wide, o.y - long, o.y + long, bodyH,
       shade(o.col, -20), shade(o.col, -45), o.col);
  // cabin
  var c0 = o.t === 'truck' ? o.y + long * 0.1 : o.y - long * 0.45;
  var c1 = o.t === 'truck' ? o.y + long * 0.85 : o.y + long * 0.45;
  box3(o.x - wide * 0.82, o.x + wide * 0.82, c0, c1, bodyH + 22,
       '#5c6a7a', '#48545f', '#8fb2cf');
  // lights
  ctx.fillStyle = o.vy < 0 ? '#fff6c8' : '#e04b3a';
  var ly = o.vy < 0 ? o.y - long : o.y + long;
  ctx.fillRect(px(o.x - wide + 3, ly) - 2, py(ly) - bodyH + 2, 9, 7);
  ctx.fillRect(px(o.x + wide - 11, ly) - 2, py(ly) - bodyH + 2, 9, 7);
  // wheels
  ctx.fillStyle = '#1c1f24';
  [[-wide, -long * 0.55], [-wide, long * 0.55], [wide, -long * 0.55], [wide, long * 0.55]].forEach(function(w) {
    var wx = px(o.x + w[0], o.y + w[1]), wy = py(o.y + w[1]);
    ctx.beginPath(); ctx.ellipse(wx, wy - 6, 8, 7, 0, 0, 6.283); ctx.fill();
  });
}

function drawBundle(b) {
  if (b.got) return;
  var sx = px(b.x, b.y), sy = py(b.y);
  var bob = Math.sin(b.t) * 3;
  shadowAt(sx, sy, 15);
  ctx.save(); ctx.translate(sx, sy - 12 + bob);
  ctx.fillStyle = '#efeade'; ctx.fillRect(-15, -13, 30, 20);
  ctx.fillStyle = '#d6d0bd'; ctx.fillRect(-15, -13, 30, 5);
  ctx.strokeStyle = '#c04a3a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 8); ctx.stroke();
  ctx.fillStyle = '#8b8272'; ctx.font = 'bold 7px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.fillText('NEWS', 0, 2);
  ctx.restore();
}

function drawPaper(p) {
  var sx = px(p.x, p.y), sy = py(p.y) - p.z;
  shadowAt(px(p.x, p.y), py(p.y), 6);
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.rot);
  ctx.fillStyle = '#fdfbf0'; ctx.fillRect(-8, -4, 16, 8);
  ctx.fillStyle = '#c9c3b2'; ctx.fillRect(-8, -4, 16, 2.5);
  ctx.restore();
}

function drawBike() {
  var sx = px(P.x, P.y), sy = py(P.y);
  var crashing = P.crash > 0;
  var t = crashing ? (1.25 - P.crash) : 0;
  if (P.invul > 0 && !crashing && Math.floor(P.invul * 14) % 2 === 0) return;

  shadowAt(sx, sy, 20);
  ctx.save();
  ctx.translate(sx, sy);
  if (crashing) {
    ctx.rotate(t * 5.2);
    ctx.translate(0, -Math.max(0, Math.sin(t * 3.4) * 36));
  } else {
    ctx.rotate(P.lean * 0.12);
    ctx.translate(0, Math.sin(P.bob) * 1.6);
  }
  var fwx = SK * 20, fwy = -VS * 20;   // front wheel offset, along the street

  // wheels
  ctx.fillStyle = '#1b1e23';
  [[fwx, fwy], [-fwx, -fwy]].forEach(function(w) {
    ctx.save(); ctx.translate(w[0], w[1] - 11); ctx.rotate(-0.95);
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 8, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#5a616b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, 6.283); ctx.stroke();
    ctx.restore();
  });
  // frame
  ctx.strokeStyle = '#d8452f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-fwx, -fwy - 11); ctx.lineTo(0, -20); ctx.lineTo(fwx, fwy - 13);
  ctx.moveTo(0, -20); ctx.lineTo(fwx * 0.4, fwy * 0.4 - 26);
  ctx.stroke();
  // handlebars
  ctx.strokeStyle = '#3a3f48'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(fwx, fwy - 13); ctx.lineTo(fwx + 1, fwy - 32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fwx - 9, fwy - 33); ctx.lineTo(fwx + 11, fwy - 30); ctx.stroke();

  var lean = crashing ? 0 : P.lean * 3;
  // paper bag
  ctx.fillStyle = '#e0b060';
  ctx.fillRect(-fwx - 12 + lean, -fwy - 40, 18, 18);
  ctx.fillStyle = '#c9973f';
  ctx.fillRect(-fwx - 12 + lean, -fwy - 40, 18, 4);
  ctx.fillStyle = '#fdfbf0';
  ctx.fillRect(-fwx - 8 + lean, -fwy - 46, 10, 8);

  // rider
  ctx.fillStyle = '#2b6fbf';
  ctx.beginPath();
  ctx.moveTo(-8 + lean, -24); ctx.lineTo(8 + lean, -24);
  ctx.lineTo(10 + lean * 1.6, -50); ctx.lineTo(-6 + lean * 1.6, -50);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8c9a0';   // arms
  ctx.save(); ctx.translate(lean * 1.6, 0);
  ctx.fillRect(2, -48, 16, 5);
  ctx.restore();
  ctx.fillStyle = '#e8c9a0';   // head
  ctx.beginPath(); ctx.arc(2 + lean * 1.8, -58, 9, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#d8452f';   // cap
  ctx.beginPath();
  ctx.arc(2 + lean * 1.8, -60, 9, Math.PI, 0); ctx.fill();
  ctx.fillRect(2 + lean * 1.8, -62, 13, 4);
  ctx.restore();

  if (crashing) {
    ctx.fillStyle = '#f2c14e';
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CRASH!', sx, sy - 92 - t * 24);
  }
}

// ---------------------------------------------------------------- frame
function drawWorld() {
  drawSky();
  drawGround();
  drawLitter();

  // everything sorted back to front
  var list = [];
  var i;
  for (i = 0; i < houses.length; i++) {
    var h = houses[i];
    if (h.y > cam + NEAR - 220 && h.y < cam + FAR + 120) list.push({ d: h.y, f: drawHouse, a: h });
  }
  for (i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (!o.dead && o.y > cam + NEAR - 90 && o.y < cam + FAR) list.push({ d: o.y, f: drawObs, a: o });
  }
  for (i = 0; i < pickups.length; i++) {
    var b = pickups[i];
    if (!b.got && b.y > cam + NEAR && b.y < cam + FAR) list.push({ d: b.y, f: drawBundle, a: b });
  }
  for (i = 0; i < papers.length; i++) list.push({ d: papers[i].y, f: drawPaper, a: papers[i] });
  list.push({ d: P.y, f: drawBike, a: null });

  list.sort(function(a, b) { return b.d - a.d; });
  for (i = 0; i < list.length; i++) list[i].f(list[i].a);

  // particles
  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    var sx = px(p.x, p.y), sy = py(p.y) - p.z;
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(sx - p.sz / 2, sy - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;

  // floating text
  ctx.textAlign = 'center';
  for (i = 0; i < texts.length; i++) {
    var t = texts[i];
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    var tx = px(t.x, t.y), ty = py(t.y) - t.z;
    ctx.strokeText(t.txt, tx, ty);
    ctx.fillStyle = t.col;
    ctx.fillText(t.txt, tx, ty);
  }
  ctx.globalAlpha = 1;

  // haze at the horizon hides pop-in
  var g = ctx.createLinearGradient(0, HORIZON - 4, 0, HORIZON + 64);
  g.addColorStop(0, 'rgba(203,226,241,.92)');
  g.addColorStop(1, 'rgba(203,226,241,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, HORIZON - 4, W, 70);
}

function drawHUD() {
  ctx.save();
  ctx.fillStyle = 'rgba(14,18,26,.82)';
  ctx.fillRect(0, 0, W, 52);
  ctx.fillStyle = '#f2c14e';
  ctx.fillRect(0, 50, W, 2);

  ctx.textAlign = 'left';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillStyle = '#f4f1e4';
  ctx.fillText('SCORE ' + String(game.score).padStart(6, '0'), 16, 33);

  ctx.fillStyle = '#8fd67a';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText(DAY_NAMES[(game.day - 1) % 7] + (game.day > 7 ? ' wk' + (Math.floor((game.day - 1) / 7) + 1) : ''), 208, 32);

  // papers
  ctx.fillStyle = '#d7d2c2';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('PAPERS', 372, 20);
  for (var i = 0; i < game.maxPapers; i++) {
    ctx.fillStyle = i < game.papers ? '#fdfbf0' : 'rgba(255,255,255,.14)';
    ctx.fillRect(372 + i * 11, 27, 8, 14);
  }

  // lives
  ctx.fillStyle = '#d7d2c2';
  ctx.fillText('LIVES', 552, 20);
  for (var l = 0; l < 3; l++) {
    ctx.fillStyle = l < game.lives ? '#d8452f' : 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(560 + l * 20, 34, 6, 0, 6.283); ctx.fill();
  }

  // customers
  ctx.fillStyle = '#d7d2c2';
  ctx.fillText('CUSTOMERS', 636, 20);
  ctx.fillStyle = game.subsLeft <= 2 ? '#ff6b5e' : '#8fd67a';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText(game.subsLeft + '/' + game.subsTotal, 636, 40);

  // street progress
  var bx = 748, bw = 236;
  ctx.fillStyle = '#d7d2c2';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('STREET', bx, 20);
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.fillRect(bx, 27, bw, 14);
  ctx.fillStyle = '#f2c14e';
  ctx.fillRect(bx, 27, bw * clamp(P.y / game.len, 0, 1), 14);
  for (var hh = 0; hh < houses.length; hh++) {
    var h = houses[hh];
    if (!h.sub && !h.missed) continue;
    ctx.fillStyle = h.delivered ? '#8fd67a' : (h.missed ? '#ff6b5e' : 'rgba(255,255,255,.75)');
    ctx.fillRect(bx + bw * clamp(h.y / game.len, 0, 1) - 1, 24, 2, 20);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, 27, bw, 14);

  if (game.streak > 1) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8fd67a';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText('PERFECT STREAK x' + game.streak, W / 2, 74);
  }
  if (muted) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8b93a5';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText('MUTED', W - 12, 68);
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    ctx.translate(rnd(-shakeAmp, shakeAmp), rnd(-shakeAmp, shakeAmp));
  }
  if (game) { drawWorld(); }
  ctx.restore();
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,90,60,' + (flashT * 1.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (game) drawHUD();
  if (state === 'finish') {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(14,18,26,.6)';
    ctx.fillRect(0, 240, W, 120);
    ctx.fillStyle = '#f2c14e';
    ctx.font = 'bold 44px "Courier New", monospace';
    ctx.fillText('ROUTE COMPLETE', W / 2, 310);
  }
}

// ---------------------------------------------------------------- overlays
function show(html) { panel.innerHTML = html; overlay.classList.remove('hidden'); }
function hide() { overlay.classList.add('hidden'); }

function showTitle() {
  show(
    '<h1>PAPER ROUTE</h1>' +
    '<p style="color:#8fd67a;letter-spacing:3px">DELIVER THE MORNING EDITION</p>' +
    '<p>Ride the street, land papers in the <b>mailboxes</b> of your customers ' +
    '(the ones with the red flag up), and keep the bike upright.</p>' +
    '<div class="keys">' +
      '<div><kbd>&#8592;</kbd><kbd>&#8594;</kbd> / <kbd>A</kbd><kbd>D</kbd></div><div>steer across the street</div>' +
      '<div><kbd>&#8593;</kbd> / <kbd>W</kbd></div><div>pedal faster</div>' +
      '<div><kbd>&#8595;</kbd> / <kbd>S</kbd></div><div>brake</div>' +
      '<div><kbd>Z</kbd> / <kbd>Q</kbd></div><div>throw a paper LEFT</div>' +
      '<div><kbd>X</kbd> / <kbd>E</kbd></div><div>throw a paper RIGHT</div>' +
      '<div><kbd>Space</kbd></div><div>throw toward the nearer kerb</div>' +
      '<div><kbd>P</kbd> &middot; <kbd>M</kbd> &middot; <kbd>R</kbd></div><div>pause &middot; mute &middot; restart</div>' +
    '</div>' +
    '<div class="rows">' +
      '<div><span>Paper in the mailbox</span><b>250 + streak bonus</b></div>' +
      '<div><span>Paper on the porch</span><b>100</b></div>' +
      '<div><span>Window of a non-customer</span><b>150</b></div>' +
      '<div><span>Knock over a bin or gnome</span><b>50</b></div>' +
      '<div><span>Miss a customer, or break their window</span><b>they cancel</b></div>' +
    '</div>' +
    '<p>Lose every customer, or crash three times, and you are fired.</p>' +
    '<p class="blink">PRESS SPACE OR ENTER TO START</p>'
  );
}

function showBrief() {
  show(
    '<h2>' + DAY_NAMES[(game.day - 1) % 7] + '</h2>' +
    '<h1 style="font-size:28px">DAY ' + game.day + '</h1>' +
    '<div class="rows">' +
      '<div><span>Customers on the route</span><b>' + game.subsTotal + '</b></div>' +
      '<div><span>Papers in the bag</span><b>' + game.papers + '</b></div>' +
      '<div><span>Street length</span><b>' + Math.round(game.len / 100) + '0 m</b></div>' +
      '<div><span>Score so far</span><b>' + game.score + '</b></div>' +
    '</div>' +
    '<p>Grab the spare bundles lying in the road &mdash; you will run dry otherwise.</p>' +
    '<p class="blink">PRESS SPACE TO RIDE</p>'
  );
}

function showSummary() {
  var safety = game.lives * 300;
  var left = game.papers * 20;
  var perfectBonus = game.perfect * 60;
  var streakBonus = game.best * 40;
  var total = safety + left + perfectBonus + streakBonus;
  game.score += total;
  show(
    '<h2>ROUTE COMPLETE</h2>' +
    '<h1 style="font-size:26px">' + DAY_NAMES[(game.day - 1) % 7] + '</h1>' +
    '<div class="rows">' +
      '<div><span>Deliveries</span><b>' + game.delivered + ' / ' + game.subsTotal + '</b></div>' +
      '<div><span>Perfect (mailbox) throws</span><b>' + game.perfect + '</b></div>' +
      '<div><span>Best streak</span><b>x' + game.best + '</b></div>' +
      '<div><span>Windows smashed</span><b>' + game.smashed + '</b></div>' +
      '<div><span>Customers lost</span><b>' + game.missed + '</b></div>' +
      '<div><span>Perfect bonus</span><b>+' + perfectBonus + '</b></div>' +
      '<div><span>Streak bonus</span><b>+' + streakBonus + '</b></div>' +
      '<div><span>Papers left over</span><b>+' + left + '</b></div>' +
      '<div><span>Safety bonus</span><b>+' + safety + '</b></div>' +
      '<div><span>TOTAL SCORE</span><b>' + game.score + '</b></div>' +
    '</div>' +
    (game.subsLeft > 0 ? '<p class="blink">PRESS SPACE FOR TOMORROW</p>'
                       : '<p class="blink">PRESS SPACE</p>')
  );
}

function showGameOver(fired) {
  show(
    '<h1 style="color:#ff6b5e;text-shadow:3px 3px 0 #45140f">GAME OVER</h1>' +
    '<h2 style="color:#f2c14e">' + (fired ? 'EVERY CUSTOMER CANCELLED' : 'THE BIKE IS A WRECK') + '</h2>' +
    '<div class="rows">' +
      '<div><span>Days on the route</span><b>' + game.day + '</b></div>' +
      '<div><span>Deliveries today</span><b>' + game.delivered + '</b></div>' +
      '<div><span>Customers left</span><b>' + Math.max(0, game.subsLeft) + '</b></div>' +
      '<div><span>FINAL SCORE</span><b>' + game.score + '</b></div>' +
    '</div>' +
    '<p class="blink">PRESS SPACE TO START A NEW ROUTE</p>'
  );
}

function showPause() {
  show('<h2>PAUSED</h2><p>Score ' + game.score + ' &middot; ' + game.papers + ' papers &middot; ' +
       game.subsLeft + ' customers left</p><p class="blink">PRESS P TO RESUME</p>');
}

// ---------------------------------------------------------------- keys / flow
function onKey(code) {
  if (code === 'KeyM') { muted = !muted; return; }
  var go = (code === 'Space' || code === 'Enter' || code === 'NumpadEnter');

  if (state === 'title') { if (go) { newGame(); state = 'brief'; showBrief(); } return; }
  if (state === 'brief') { if (go) { hide(); state = 'play'; sfx('bell'); } return; }
  if (state === 'summary') {
    if (go) {
      if (game.subsLeft <= 0) { endGame(true); return; }
      game.day++; game.lives = Math.min(3, game.lives + (game.day % 3 === 0 ? 1 : 0));
      startDay(); state = 'brief'; showBrief();
    }
    return;
  }
  if (state === 'over') { if (go) { newGame(); state = 'brief'; showBrief(); } return; }
  if (state === 'pause') { if (code === 'KeyP') { hide(); state = 'play'; } return; }

  if (state === 'play') {
    if (code === 'KeyP') { state = 'pause'; showPause(); return; }
    if (code === 'KeyR') { newGame(); state = 'brief'; showBrief(); return; }
    if (THROW_L[code]) { throwPaper(-1); return; }
    if (THROW_R[code]) { throwPaper(1); return; }
    if (code === 'Space') { throwPaper(P.x < 500 ? -1 : 1); return; }
  }
}

// ---------------------------------------------------------------- loop
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state === 'play') update(dt);
  else if (state === 'finish') {
    game.finishT += dt;
    P.speed = Math.max(0, P.speed - 200 * dt);
    P.y += P.speed * dt;
    cam = P.y;
    updateFx(dt);
    updatePapers(dt);
    if (game.finishT > 1.9) { state = 'summary'; showSummary(); }
  }

  render();
  requestAnimationFrame(frame);
}

// boot
newGame();
state = 'title';
showTitle();
requestAnimationFrame(frame);

})();
</script>
